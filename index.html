<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>💰 Student Expense Tracker</h1>
            <p>Track your daily expenses easily</p>
        </header>
        <section class="summary">
            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="totalExpense">₹0</p>
            </div>
            <div class="summary-card">
                <h3>Number of Expenses</h3>
                <p id="expenseCount">0</p>
            </div>
        </section>
        <section class="expense-form">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <input
                    type="text"
                    id="expenseName"
                    placeholder="Expense name"
                    required
                >
                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Amount"
                    min="1"
                    required
                >
                <select id="expenseCategory">
                    <option value="Food">
                        Food
                    </option>
                    <option value="Travel">
                        Travel
                    </option>
                    <option value="Education">
                        Education
                    </option>
                    <option value="Entertainment">
                        Entertainment
                    </option>
                    <option value="Other">
                        Other
                    </option>
                </select>
                <button type="submit">
                    Add Expense
                </button>
            </form>
        </section>
        <section class="filter">
            <label for="categoryFilter">
                Filter:
            </label>
            <select id="categoryFilter">
                <option value="All">
                    All
                </option>
                <option value="Food">
                    Food
                </option>
                <option value="Travel">
                    Travel
                </option>
                <option value="Education">
                    Education
                </option>
                <option value="Entertainment">
                    Entertainment
                </option>
                <option value="Other">
                    Other
                </option>
            </select>
        </section>
        <section>
            <h2>Expense History</h2>
            <div id="expenseList">
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
